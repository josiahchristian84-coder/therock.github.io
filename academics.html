<!DOCTYPE html>
<html lang="en">    
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Academics | The Rock</title>
<style>
:root {
            --primary-light: #1e293b;
            --accent: #ffae00;
            --text-light: #ffffff;
            --glass: rgba(255, 255, 255, 0.03);
            --transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }

        body {
            background-image: url('academics.jpg');
            background-size: cover;
            background-position: center;
            background-attachment: flex;
            background-blend-mode: overlay;
            color: var(--text-light);
            line-height: 1.6;
            overflow-x: hidden;
        }


        .navbar {
            position: fixed;
            top: 0;
            width: 100%;
            padding: 1.2rem 8%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(15, 23, 42, 0.9);
            backdrop-filter: blur(15px);
            z-index: 1000;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }

        .logo {
            font-size: 1.4rem;
            font-weight: 700;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .logo span { color: var(--accent); }

        .nav-links {
            list-style: none;
            display: flex;
            align-items: center;
        }

        .nav-links li { margin-left: 2.5rem; }

        .nav-links a {
            text-decoration: none;
            color: white;
            font-size: 0.9rem;
            font-weight: 500;
            transition: 0.3s;
            opacity: 0.8;
        }

        .nav-links a:hover { opacity: 1; color: var(--accent); }

        .btn-apply {
            background: var(--accent);
            color: var(--primary);
            padding: 0.7rem 1.5rem;
            border-radius: 8px;
            font-weight: 700;
            opacity: 1;
        }

        .hero {
            height: 100vh;
            background: linear-gradient(rgba(15, 23, 42, 0.8), rgba(15, 23, 42, 0.8)),;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 0 20px;
        }

        .hero-content h1 {
            font-size: clamp(2.5rem, 8vw, 4.5rem);
            margin-bottom: 1.5rem;
            line-height: 1.1;
        }

        .hero-content p {
            font-size: 1.2rem;
            max-width: 600px;
            margin: 0 auto 2.5rem;
            opacity: 0.9;
        }

        .accent { color: var(--accent); }

        .btn-group {
            display: flex;
            gap: 1.5rem;
            justify-content: center;
        }

        .btn-main {
            padding: 1.2rem 2.5rem;
            background: var(--accent);
            color: var(--primary);
            text-decoration: none;
            border-radius: 50px;
            font-weight: 700;
            transition: var(--transition);
        }

        .btn-main:hover { transform: scale(1.05); box-shadow: 0 10px 20px rgba(251, 191, 36, 0.3); }

        .btn-outline {
            padding: 1.2rem 2.5rem;
            border: 2px solid white;
            color: white;
            text-decoration: none;
            border-radius: 50px;
            transition: 0.3s;
        }

        .btn-outline:hover { background: white; color: var(--primary); }

        .features {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 2.5rem;
            padding: 8rem 10%;
        }

        .feature-card {
            background: var(--glass);
            color: rgb(255, 255, 255);
            padding: 4rem 2rem;
            border-radius: 24px;
            text-align: center;
            border: 1px solid rgba(255, 174, 0, 0);
            transition: var(--transition);
        }

        .feature-card:hover {
            background: rgba(255,255,255,0.08);
            transform: translateY(-15px);
            border-color: var(--accent);
        }

        .feature-card i {
            font-size: 3.5rem;
            color: var(--accent);
            margin-bottom: 2rem;
        }

        .feature-card h3 { margin-bottom: 1rem; font-size: 1.5rem; }

</style>

</head>
<body>
    <nav class="navbar">
        <div class="logo">The <span>Rock</span></div>
        <ul class="nav-links">
            <li><a href="index.html">Home</a></li>
            <li><a href="about.html">About</a></li>
            <li><a href="academics.html">Academics</a></li>
            <li><a href="apply.html" class="btn-apply">Enroll Now</a></li>
        </ul>
    </div>
    <div class="picture">
            <img src="picture.png" alt="Profile Picture" style="width: 40px; height: 40px; margin-right: -300rem; border-radius: 50%;">
        </div>
    </nav>
    <section class="features" style="padding-top: 150px;">
        <h2 class="reveal" style="grid-column: 1/-1; text-align: center; font-size: 3rem; margin-bottom: 50px;">Future-Ready <span class="accent">Programs</span></h2>
        <div class="feature-card">
            <h3>Annual Events</h3>
            <p>Science Exhibitions, Sports competitions, and Music and Dance Productions.</p>
        </div>
        <div class="feature-card">
            <h3>Creative Arts</h3>
            <p>Graphic Designs, Worship Bands, and Debates.</p>
        </div>
        <div class="feature-card">
            <h3>Global Studies</h3>
            <p>Language, Culture, and Religious Studies programs.</p>
        </div>
    </section>
</body>
</html>
