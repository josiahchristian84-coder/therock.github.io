<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enroll | The Rock Christian School</title>
    <link rel="stylesheet" href="apply.css">
</head>
<body>
    <nav class="navbar">
        <div class="logo">The <span>Rock</span></div>
        <ul class="nav-links">
            <li><a href="index.html">Home</a></li>
            <li><a href="about.html">About</a></li>
            <li><a href="academics.html">Academics</a></li>
            <li><a href="apply.html" class="btn-apply">Enroll Now</a></li>
        </ul>
    </div>
    <div class="picture">
            <img src="picture.png" alt="Profile Picture" style="width: 40px; height: 40px; margin-right: -300rem; border-radius: 50%;">
        </div>
    </nav>
        <div class="container">
            <div class="form-box active" id="login-form">
            <h2>Login</h2>
            <input type="email" class="form-input" placeholder="Email Address">
            <input type="password" class="form-input" placeholder="Password">
                <li><a href="congradulations.html"><button class="btn-submit">Login</button></a></li>
            <p class="form-footer-text">
                If you don't have an account, click <a href="#" onclick="showForm('register-form')">Register</a>.
            </p>
            </form>
        </div>
        <div class="form-box" id="register-form">
            <h2>Register</h2>
            <input type="text" name="student_name" class="form-input" placeholder="Student Name" required>
            <input type="email" name="parent_email" class="form-input" placeholder="Parent/Guardian Email Address" required>
            <select name="selected_course" class="form-input" required>
                <option value="" disabled selected>Select Course</option>
                <option value="Kindergarten">Kindergarten</option>
                <option value="Nursery">Nursery</option>
                <option value="Primary">Primary</option>
                <option value="ACE">A.C.E</option>0
                </select>
            <input type="number" name="age" class="form-input" placeholder="Age" required>
            <input type="password" name="register_password" class="form-input" placeholder="Password" required>
            <input type="password" name="confirm_password" class="form-input" placeholder="Confirm Password" required>
            <button type="submit" name="submit_register" class="btn-submit"><li><a href="congradulations.html">Register</button></a></li>
            <p class="form-footer-text">
                Already have an account? Click <a href="#" onclick="showForm('login-form')">Login</a>.
            </p>
        </form>
        </div>
    <script></script>
</body>
</html>
