<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enroll | The Rock Christian School</title>
    <link rel="stylesheet" href="apply.css">
</head>
<body>
    <!-- Fixed navbar wrapper structure -->
    <nav class="navbar">
        <div class="logo">The <span>Rock</span></div>
        <ul class="nav-links">
            <li><a href="index.html">Home</a></li>
            <li><a href="about.html">About</a></li>
            <li><a href="academics.html">Academics</a></li>
            <li><a href="apply.html" class="btn-apply">Enroll Now</a></li>
        </ul>
        <!-- Fixed: Removed stray </div>, wrapped avatar profile neatly inside navbar -->
        <div class="picture">
            <img src="picture.png" alt="Profile Picture">
        </div>
    </nav>

    <div class="container">
        <!-- Fixed: Added missing opening <form> tag and removed illegal outer <li> tags from buttons -->
        <div class="form-box active" id="login-form">
            <form action="YouHaveFinished.html" method="POST">
                <h2>Login</h2>
                <input type="email" class="form-input" placeholder="Email Address" required>
                <input type="password" class="form-input" placeholder="Password" required>
                
                <button type="submit" class="btn-submit">Login</button>
                
                <p class="form-footer-text">
                    If you don't have an account, click <a href="#" onclick="showForm(event, 'register-form')">Register</a>.
                </p>
            </form>
        </div>

        <!-- Fixed: Balanced form hierarchies and corrected redirect container paths -->
        <div class="form-box" id="register-form">
            <form action="YouHaveFinished.html" method="POST">
                <h2>Register</h2>
                <input type="text" name="student_name" class="form-input" placeholder="Student Name" required>
                <input type="email" name="parent_email" class="form-input" placeholder="Parent/Guardian Email Address" required>
                <select name="selected_course" class="form-input" required>
                    <option value="" disabled selected>Select Course</option>
                    <option value="Kindergarten">Kindergarten</option>
                    <option value="Nursery">Nursery</option>
                    <option value="Primary">Primary</option>
                    <option value="ACE">A.C.E</option>
                </select>
                <input type="number" name="age" min="1" class="form-input" placeholder="Age" required>
                <input type="password" name="register_password" class="form-input" placeholder="Password" required>
                <input type="password" name="confirm_password" class="form-input" placeholder="Confirm Password" required>
                
                <button type="submit" name="submit_register" class="btn-submit">Register</button>
                
                <p class="form-footer-text">
                    Already have an account? Click <a href="#" onclick="showForm(event, 'login-form')">Login</a>.
                </p>
            </form>
        </div>
    </div>

    <!-- Script added to cleanly flip between form boxes without reloading page layouts -->
    <script>
        function showForm(event, formId) {
            event.preventDefault(); // Stop page jumping behavior
            
            // Hide all form box frames
            document.querySelectorAll('.form-box').forEach(box => {
                box.classList.remove('active');
            });
            
            // Activate target form
            document.getElementById(formId).classList.add('active');
        }
    </script>
</body>
</html>
